# Apache vhost snippet for Laragon (merge into auto.zahid.billxiot_gps.conf :443 block)
# Browser: wss://zahid.billxiot_gps/app/  ->  Reverb: ws://127.0.0.1:8080/app/

    <IfModule mod_proxy.c>
        ProxyPreserveHost On
        ProxyRequests Off

        RewriteEngine On
        RewriteCond %{HTTP:Upgrade} =websocket [NC]
        RewriteRule ^/app/(.*)$ ws://127.0.0.1:8080/app/$1 [P,L]
        RewriteCond %{HTTP:Upgrade} !=websocket [NC]
        RewriteRule ^/app/(.*)$ http://127.0.0.1:8080/app/$1 [P,L]

        ProxyPassReverse /app/ ws://127.0.0.1:8080/app/
    </IfModule>
