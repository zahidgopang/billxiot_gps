<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>tracking mobile harness</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .fake-nav { height: 60px; background:#0f172a; color:#fff; display:flex; align-items:center; padding:0 1rem; font-weight:600; position:sticky; top:0; z-index:900; }
  .content-wrap { padding:0; }

  /* ===== Tokens (copied from blade) ===== */
  .tc-app {
    --tc-radius-sm: 6px; --tc-radius: 10px; --tc-radius-lg: 14px;
    --tc-shadow-sm: 0 1px 3px rgba(15,23,42,.08); --tc-shadow: 0 4px 14px rgba(15,23,42,.12); --tc-shadow-lg: 0 12px 32px rgba(15,23,42,.18);
    --tc-bg:#eef2f6; --tc-surface:#fff; --tc-surface-2:#f5f8fa; --tc-border:#d9e1e8; --tc-border-soft:#eef2f7;
    --tc-text:#1e293b; --tc-text-muted:#64748b; --tc-primary:#1976d2;
    --tc-running:#16a34a; --tc-idle:#eab308; --tc-stopped:#f97316; --tc-offline:#ef4444; --tc-alert:#dc2626;
  }
  .tc-app { display:flex; flex-direction:column; height:calc(100vh - 64px); min-height:460px; background:#eef2f6; }

  .tc-iconbar { display:flex; align-items:center; gap:.15rem; flex-wrap:wrap; padding:.35rem .6rem; background:#fff; border-bottom:1px solid #d9e1e8; box-shadow:0 1px 3px rgba(15,23,42,.06); z-index:6; }
  .tc-iconbar a { display:inline-flex; align-items:center; justify-content:center; width:38px; height:38px; border-radius:8px; color:#5b6b7b; text-decoration:none; font-size:1.05rem; }
  .tc-iconbar a.active { background:#1976d2; color:#fff; }
  .tc-iconbar .tc-iconbar-sep { flex:1; }

  .tc-main { flex:1; display:flex; min-height:0; position:relative; }

  .tc-panel-toggle { display:none; position:absolute; top:12px; inset-inline-start:12px; z-index:7; width:42px; height:42px; border:none; border-radius:10px; background:var(--tc-surface); color:var(--tc-primary); align-items:center; justify-content:center; font-size:1.05rem; box-shadow:var(--tc-shadow); cursor:pointer; }
  .tc-panel-toggle .tc-toggle-badge { position:absolute; top:-5px; inset-inline-end:-5px; min-width:18px; height:18px; padding:0 4px; border-radius:9px; background:var(--tc-primary); color:#fff; font-size:.62rem; font-weight:700; display:flex; align-items:center; justify-content:center; line-height:1; }
  .tc-panel-backdrop { position:absolute; inset:0; background:rgba(15,23,42,.45); z-index:8; opacity:0; visibility:hidden; pointer-events:none; transition:opacity .25s ease, visibility .25s ease; }
  .tc-panel-backdrop.show { opacity:1; visibility:visible; pointer-events:auto; }

  .tc-panel { width:min(360px,94vw); flex-shrink:0; display:flex; flex-direction:column; background:#fff; border-inline-end:1px solid #d9e1e8; z-index:4; }
  .tc-tabs { display:flex; border-bottom:1px solid #d9e1e8; }
  .tc-tab { flex:1; padding:.6rem .4rem; text-align:center; font-size:.82rem; font-weight:600; color:#5b6b7b; background:#f5f8fa; border:none; border-bottom:2px solid transparent; }
  .tc-tab.active { color:#1976d2; background:#fff; border-bottom-color:#1976d2; }
  .tc-tab-head { padding:.6rem; border-bottom:1px solid #eef0f3; }
  .tc-tab-head input { width:100%; padding:.3rem .5rem; border:1px solid #d9e1e8; border-radius:6px; }
  .tc-list { flex:1; overflow-y:auto; }
  .tc-row { display:flex; align-items:flex-start; gap:.5rem; padding:.55rem .7rem; border-bottom:1px solid rgba(15,23,42,.05); }
  .tc-veh-icon { width:20px; text-align:center; font-size:1rem; }
  .tc-row-info { flex:1; min-width:0; }
  .tc-row-title { font-weight:600; font-size:.86rem; color:#1e293b; }
  .tc-meta-chips { display:flex; flex-wrap:wrap; gap:.3rem .5rem; align-items:center; margin-top:.15rem; }
  .tc-meta-chip { display:inline-flex; align-items:center; gap:.22rem; font-size:.72rem; color:var(--tc-text-muted); }

  .tc-map-wrap { position:relative; flex:1; min-width:0; display:flex; flex-direction:column; }
  .tc-map-area { position:relative; flex:1; min-height:0; }
  #tcMap { position:absolute; inset:0; background:#cfe0d6 repeating-linear-gradient(45deg,#cfe0d6,#cfe0d6 16px,#c5d8cd 16px,#c5d8cd 32px); display:flex; align-items:center; justify-content:center; color:#5b6b7b; font-weight:600; }
  .tc-map-controls { position:absolute; top:12px; inset-inline-end:12px; display:flex; flex-direction:column; gap:8px; z-index:5; }
  .tc-map-controls .btn { width:42px; height:42px; padding:0; display:inline-flex; align-items:center; justify-content:center; box-shadow:0 4px 14px rgba(15,23,42,.15); background:#fff; border:1px solid #e2e8f0; border-radius:8px; color:#334155; }
  .tc-ctrl-group { display:flex; flex-direction:column; border-radius:8px; overflow:hidden; box-shadow:0 4px 14px rgba(15,23,42,.15); }
  .tc-ctrl-group .btn { box-shadow:none; border-radius:0; }

  .tc-footer { height:250px; flex-shrink:0; display:flex; flex-direction:column; background:#fff; border-top:1px solid #d9e1e8; box-shadow:0 -2px 10px rgba(15,23,42,.08); z-index:5; }
  .tc-footer[hidden] { display:none !important; }
  .tc-footer-head { display:flex; align-items:center; gap:.75rem; padding:.4rem .7rem; border-bottom:1px solid #eef0f3; font-size:.82rem; font-weight:600; }
  .tc-footer-title { flex:1; }
  .tc-footer-body { flex:1; overflow:auto; padding:.5rem; }

  /* ===== Tablet ===== */
  @media (max-width:1024px) and (min-width:769px){
    .tc-panel { width:min(320px,42vw); }
    .tc-map-controls .btn { width:40px; height:40px; }
  }
  /* ===== Mobile drawer ===== */
  @media (max-width:768px){
    .tc-iconbar { flex-wrap:nowrap; overflow-x:auto; overflow-y:hidden; scrollbar-width:none; }
    .tc-iconbar::-webkit-scrollbar { display:none; }
    .tc-iconbar a { flex:0 0 auto; width:40px; height:40px; }
    .tc-iconbar .tc-iconbar-sep { display:none; }
    .tc-panel { position:absolute; top:0; bottom:0; inset-inline-start:0; width:86vw; max-width:340px; border-inline-end:1px solid var(--tc-border); box-shadow:var(--tc-shadow-lg); transform:translateX(-106%); transition:transform .28s ease; z-index:9; will-change:transform; }
    [dir="rtl"] .tc-panel { transform:translateX(106%); }
    .tc-panel.tc-panel--open { transform:none; }
    .tc-panel-toggle { display:inline-flex; }
    .tc-map-controls { top:10px; inset-inline-end:10px; gap:6px; z-index:6; }
    .tc-map-controls .btn { width:40px; height:40px; }
    .tc-footer { height:auto; max-height:58dvh; }
    .tc-footer-title { display:none; }
  }
  @media (max-width:768px) and (orientation:landscape){
    .tc-panel { width:62vw; max-width:320px; }
    .tc-footer { max-height:70dvh; }
  }
  @media (hover:none) and (pointer:coarse){
    .tc-row { padding-top:.7rem; padding-bottom:.7rem; }
    .tc-tab { padding:.75rem .4rem; }
  }
</style>
</head>
<body>
<div class="fake-nav">Admin navbar (sticky)</div>
<main class="content-wrap">
<div class="tc-app">
  <div class="tc-iconbar">
    <a class="active" href="#"><i class="fas fa-location-arrow"></i></a>
    <a href="#"><i class="fas fa-chart-bar"></i></a>
    <a href="#"><i class="fas fa-draw-polygon"></i></a>
    <a href="#"><i class="fas fa-wrench"></i></a>
    <a href="#"><i class="fas fa-id-card"></i></a>
    <a href="#"><i class="fas fa-terminal"></i></a>
    <a href="#"><i class="fas fa-tasks"></i></a>
    <a href="#"><i class="fas fa-bell"></i></a>
    <a href="#"><i class="fas fa-sliders-h"></i></a>
    <span class="tc-iconbar-sep"></span>
  </div>
  <div class="tc-main">
    <button type="button" class="tc-panel-toggle" id="tcPanelToggle" aria-expanded="false">
      <i class="fas fa-list-ul"></i><span class="tc-toggle-badge">7</span>
    </button>
    <div class="tc-panel-backdrop" id="tcPanelBackdrop"></div>
    <aside class="tc-panel" id="tcPanel">
      <div class="tc-tabs">
        <button class="tc-tab active">Objects</button>
        <button class="tc-tab">Events</button>
        <button class="tc-tab">Places</button>
        <button class="tc-tab">History</button>
      </div>
      <div class="tc-tab-head"><input type="search" placeholder="Search vehicles"></div>
      <div class="tc-list" id="list"></div>
    </aside>
    <div class="tc-map-wrap">
      <div class="tc-map-area">
        <div id="tcMap">MAP AREA</div>
        <div class="tc-map-controls">
          <div class="tc-ctrl-group">
            <button class="btn"><i class="fas fa-plus"></i></button>
            <button class="btn"><i class="fas fa-minus"></i></button>
          </div>
          <button class="btn"><i class="fas fa-compress-arrows-alt"></i></button>
          <button class="btn"><i class="fas fa-crosshairs"></i></button>
          <button class="btn"><i class="fas fa-sync-alt"></i></button>
          <button class="btn"><i class="fas fa-traffic-light"></i></button>
          <button class="btn"><i class="fas fa-layer-group"></i></button>
          <button class="btn"><i class="fas fa-camera"></i></button>
        </div>
      </div>
      <div class="tc-footer" id="tcFooter" hidden>
        <div class="tc-footer-head">
          <button class="tc-tab">Data</button><button class="tc-tab">Graph</button><button class="tc-tab">Messages</button>
          <span class="tc-footer-title">Vehicle name</span>
          <button class="btn" style="margin-inline-start:auto"><i class="fas fa-times"></i></button>
        </div>
        <div class="tc-footer-body">Footer content with grouped cards…</div>
      </div>
    </div>
  </div>
</div>
</main>
<script>
  // build rows
  var names = ['Toyota Hilux','Isuzu D-Max','Suzuki Carry','Honda CG','Hino 300','Mazda BT-50','Kia K2700'];
  var html = names.map(function(n){
    return '<div class="tc-row"><span class="tc-veh-icon" style="color:#16a34a"><i class="fas fa-car-side"></i></span>'
      + '<span class="tc-row-info"><span class="tc-row-title">'+n+'</span>'
      + '<span class="tc-meta-chips"><span class="tc-meta-chip"><i class="fas fa-gauge-high"></i>42 km/h</span>'
      + '<span class="tc-meta-chip"><i class="fas fa-clock"></i>2m</span>'
      + '<span class="tc-meta-chip" style="color:#16a34a"><i class="fas fa-key"></i>ON</span>'
      + '<span class="tc-meta-chip" style="color:#16a34a"><i class="fas fa-satellite-dish"></i>11</span>'
      + '<span class="tc-meta-chip" style="color:#16a34a"><i class="fas fa-battery-full"></i>92%</span></span></span>'
      + '<button class="btn" style="border:none;background:none;color:#94a3b8"><i class="fas fa-ellipsis-v"></i></button></div>';
  }).join('');
  document.getElementById('list').innerHTML = html;

  function isMobile(){ return window.matchMedia('(max-width:768px)').matches; }
  var panel = document.getElementById('tcPanel');
  var bd = document.getElementById('tcPanelBackdrop');
  var toggle = document.getElementById('tcPanelToggle');
  function open(){ if(!isMobile())return; panel.classList.add('tc-panel--open'); bd.classList.add('show'); toggle.setAttribute('aria-expanded','true'); }
  function close(){ panel.classList.remove('tc-panel--open'); bd.classList.remove('show'); toggle.setAttribute('aria-expanded','false'); }
  toggle.addEventListener('click', function(){ panel.classList.contains('tc-panel--open')?close():open(); });
  bd.addEventListener('click', close);

  // fit height like real JS
  function fit(){ var app=document.querySelector('.tc-app'); var top=app.getBoundingClientRect().top+(window.scrollY||0); app.style.height=Math.max(360,(window.innerHeight-top))+'px'; }
  fit(); window.addEventListener('resize', fit);

  // URL flags for screenshots: ?open=1 opens drawer, ?footer=1 shows footer, ?rtl=1
  var p = new URLSearchParams(location.search);
  if(p.get('rtl')==='1'){ document.documentElement.dir='rtl'; }
  if(p.get('footer')==='1'){ document.getElementById('tcFooter').hidden=false; }
  if(p.get('open')==='1'){ setTimeout(open, 50); }
  if(p.get('debug')==='1'){
    setTimeout(function(){
      function r(sel){ var e=document.querySelector(sel); if(!e) return sel+': none'; var b=e.getBoundingClientRect(); return sel+': x='+Math.round(b.x)+' y='+Math.round(b.y)+' w='+Math.round(b.width)+' h='+Math.round(b.height); }
      var d=document.createElement('div');
      d.style.cssText='position:fixed;bottom:0;left:0;right:0;z-index:9999;background:#000;color:#0f0;font:12px monospace;padding:6px;white-space:pre-line';
      d.textContent=[r('.tc-main'),r('.tc-map-wrap'),r('.tc-map-area'),r('.tc-map-controls'),r('.tc-panel'),'innerW='+window.innerWidth].join('\n');
      document.body.appendChild(d);
    }, 200);
  }
</script>
</body>
</html>
